[project]
name = "picologs-server"
version = "0.1.0"
description = "MQTT log aggregation server with REST and WebSocket APIs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "aiomqtt>=2.0.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
picologs-server = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
